name: Release APK

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: prod
    permissions:
      contents: write # needed to create GitHub Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build
        env:
          VITE_ANTHROPIC_API_KEY: ${{ secrets.VITE_ANTHROPIC_API_KEY }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          VERSION=${GITHUB_REF_NAME}
          cp android/app/build/outputs/apk/debug/app-debug.apk ctrl-me-${VERSION}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: CTRL+Me ${{ github.ref_name }}
          body: |
            ## CTRL+Me ${{ github.ref_name }}

            ### Installa su Android
            1. Scarica `ctrl-me-${{ github.ref_name }}.apk`
            2. Su Android: Impostazioni → App → Installa app sconosciute → abilita per il tuo browser
            3. Apri il file scaricato → Installa

            > APK debug — per test personale. Non per distribuzione pubblica.
          files: ctrl-me-${{ github.ref_name }}.apk
          draft: false
          prerelease: false
